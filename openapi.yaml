  /api/v1/mobile/employee/schedule:
    get:
      tags: [EmployeeMySchedule]
      summary: My Schedule (Employee My Plan tab)
      description: |
        **EMPLOYEE only** — Flutter "My Schedule" / My Plan screen (not SM calendar).

        Query the week/month window with `startDate` + `endDate`. Response is day buckets:
        - Days with crew assignments → `phases[]` (calendar dots)
        - Empty days in the window → `phases: []` (so the week strip can render)

        Card mapping:
        - `project.name` → "Prj · Goltsteins.Complex"
        - `type` → badge / legend (ERECTION green, DISMANTLING orange, MAINTENANCE/STANDING → Other blue)
        - `startDate` / `endDate` / `assignedHours` → time row
        - `siteManagers[]` → "Site Manager: First Last"

        Site Manager calendar remains `GET /mobile/schedule` (unchanged, SM-only).
      operationId: getEmployeeSchedule
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: startDate
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: endDate
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: My Schedule fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeScheduleResponse'
              example:
                success: true
                message: 'Schedule fetched successfully.'
                meta: { total: 7, page: 1, limit: 10, totalPages: 1 }
                data:
                  - date: '2026-09-18'
                    phases:
                      - id: '111e4567-e89b-12d3-a456-426614174000'
                        type: ERECTION
                        status: IN_PROGRESS
                        priority: MEDIUM
                        startDate: '2026-09-18T07:30:00.000Z'
                        endDate: '2026-09-18T16:30:00.000Z'
                        project:
                          id: '222e4567-e89b-12d3-a456-426614174000'
                          name: Goltsteins.Complex
                          address: Goltsteinstraße 12, Köln
                        siteManagers:
                          - id: '333e4567-e89b-12d3-a456-426614174000'
                            firstName: Mesut
                            lastName: Rahaman
                        assignedHours: 9
                  - date: '2026-09-19'
                    phases: []
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Not an employee (SITE_MANAGER must use GET /mobile/schedule)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

