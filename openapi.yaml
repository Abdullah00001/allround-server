        Returns the authenticated admin's profile (`firstName`, `lastName`, `email`,
        `phone`, `avatarUrl`, `role`, `language`, `createdAt`). Cookie + CSRF required.
      operationId: getAdminProfile
      security:
        - adminAuth: []
      parameters:
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdminProfileResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: CSRF validation failed or forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
    patch:
      tags: [Admin]
      summary: Update admin self-profile
      description: |
        Updates the authenticated admin's profile. Patchable: `firstName`, `lastName`,
        `phone` (no format), `avatarUrl` (URL or null), `language` (upserts UserPreference).
        At least one field required. Not patchable: email, role, status, password.
        Upload avatar via `POST /media` first.
      operationId: updateAdminProfile
      security:
        - adminAuth: []
      parameters:
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminProfileRequest'
            example:
              firstName: Admin
              lastName: User
              phone: '+491234567890'
              avatarUrl: https://cdn.example.com/admin.jpg
              language: DE
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdminProfileResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
