            example:
              currentPassword: 'CurrentPassword123!'
              newPassword: 'NewSecurePassword123!'
      responses:
        '200':
          description: Admin password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeAdminPasswordResponse'
