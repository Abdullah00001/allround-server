  /api/v1/mobile/projects:
    get:
      tags: [MobileDashboard, MobileProjectManagement]
      summary: List project cards
      description: >
        Returns one card per project (displaying its primary/active phase) for projects
        visible to the authenticated user (GLOBAL_ACCESS or assignment-scoped).
        Supports UI tabs (`tab`), filter-modal multi-selects (`phaseTypes`,
        `phaseStatuses`, `priorities`, `categories` as CSV or repeated
        query params), and sorting (`sortBy`). Cities filter against `Project.city`.
        Use `phaseStatuses=COMPLETED` for the Completed modal filter. UI label
        Preconstruction maps to status `ENQUIRY` (not a PhaseType).
      operationId: getMobileProjects
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tab
          schema:
            type: string
            enum: [ALL, ACTIVE, MY_PROJECTS, THIS_WEEK, INSPECTION]
            default: ALL
          description: Top navigation tab filter
        - in: query
          name: phaseTypes
          schema:
            type: string
          description: Comma-separated PhaseType values (or repeated query params)
          example: ERECTION,DISMANTLING
        - in: query
          name: phaseStatuses
          schema:
            type: string
          description: Comma-separated PhaseStatus values (e.g. COMPLETED for Completed filter)
          example: COMPLETED,IN_PROGRESS
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive search across project name, address, and city
        - in: query
          name: lat
          schema:
            type: number
          description: Center latitude for geo filter (requires lng)
        - in: query
          name: lng
          schema:
            type: number
          description: Center longitude for geo filter (requires lat)
        - in: query
          name: radiusKm
          schema:
            type: number
            default: 25
          description: Geo filter radius in kilometers (default 25; used with lat+lng).
        - in: query
          name: priorities
          schema:
            type: string
          description: Comma-separated Priority values
          example: HIGH,MEDIUM
        - in: query
          name: categories
          schema:
            type: string
          description: Comma-separated CustomerCategory values
          example: COMMERCIAL,MUNICIPALITY
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [NEWEST, NEXT_INSPECTION, NAME_AZ]
            default: NEWEST
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Page size
      responses:
        '200':
          description: Phase cards fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMobileProjectsResponse'
        '401':
          description: Authentication or device session failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Account inactive or suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
    post:
      tags: [MobileProjectManagement]
      summary: Create project (Site Manager)
      description: |
        Creates a project from the Create New Project form.

        **Location:** required map `coordinates` (`lat`/`lng`). Optional `placeLabel`
        is stored as DB address; otherwise `"lat, lng"` is used.

        **Customer (`customer.mode` discriminator):**
        - `EXISTING` — send `{ "mode": "EXISTING", "customerId": "<uuid>" }`. Do **not**
          send `name` / `category`. Links the project to that customer and upserts a
          new primary `CustomerContact` from `contact`.
        - `NEW` — send `{ "mode": "NEW", "name": "...", "category?": "COMMERCIAL" }`.
          Do **not** send `customerId`. Creates a customer (+ primary contact). Category
          defaults to `COMMERCIAL` (`COMMERCIAL` | `MUNICIPALITY` | `ARCHITECT` | `PRIVATE`).

        **`contact` is always required** for both modes.

        **`status`:** use `PhaseStatus` values only (`ENQUIRY`, `QUOTATION`,
        `ORDER_CONFIRMED`, `IN_PROGRESS`, `COMPLETED`, `POSTPONED`). There is no
        `PLANNED` / `NOT_STARTED` — map UI “Planned” → `ENQUIRY` (or omit; default `ENQUIRY`).
        Full catalogs: `GET /mobile/config` → `data.enums`.
      operationId: createMobileProject
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMobileProjectRequest'
            examples:
              existingCustomer:
                summary: Existing customer
                value:
                  name: Goltstein Complex
                  coordinates: { lat: 50.9082, lng: 6.9723 }
                  placeLabel: Goltsteinstraße 12, Köln
                  scaffoldSpecification: { area: 450, height: 15, type: Modular scaffold }
                  priority: MEDIUM
                  phaseType: ERECTION
                  status: ENQUIRY
                  customer:
                    mode: EXISTING
                    customerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  contact:
                    name: Andreas Weber
                    phone: '+49654515151'
                    email: abc@yopmail.com
                    role: Project lead
                  scheduleData:
                    - type: erection
                      startDate: '2026-11-14T18:00:00.000Z'
                      endDate: '2026-11-18T08:30:00.000Z'
                      durationDays: 3
                    - type: dismantling
                      startDate: '2026-11-29T08:30:00.000Z'
                      endDate: '2026-12-02T08:30:00.000Z'
                      durationDays: 3
              newCustomer:
                summary: New customer
                value:
                  name: Goltstein Complex
                  coordinates: { lat: 50.9082, lng: 6.9723 }
                  placeLabel: Goltsteinstraße 12, Köln
                  scaffoldSpecification: { area: 450, height: 15, type: Modular scaffold }
                  priority: MEDIUM
                  phaseType: ERECTION
                  status: ENQUIRY
                  customer:
                    mode: NEW
                    name: Hochtief AG
                    category: COMMERCIAL
                  contact:
                    name: Andreas Weber
                    phone: '+49654515151'
                    email: abc@yopmail.com
                    role: Project lead
                  scheduleData:
                    - type: erection
                      startDate: '2026-11-14T18:00:00.000Z'
                      endDate: '2026-11-18T08:30:00.000Z'
                      durationDays: 3
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMobileProjectDetailResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Forbidden (not site manager)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: Customer or site manager not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
