  /api/v1/mobile/profile:
    get:
      tags: [MobileDashboard]
      summary: Get mobile profile stats
      description: >
        Returns profile fields (including `language` from UserPreference), plus
        hoursThisWeek (UTC ISO week, APPROVED net hours), assignedProjectsCount,
        and completedProjectsCount (all phases COMPLETED). Available to EMPLOYEE
        and SITE_MANAGER.
        Also enqueues a dummy `SYSTEM_ALERT` test notification for the caller
        (alua profile-GET parity) so Socket/FCM + `GET /mobile/notifications` can be verified.
        Requires the notification worker to be running.
      operationId: getMobileProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMobileProfileResponse'

        '401':
          description: Authentication or device session failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenInvalid:
                  value:
                    success: false
                    message: 'Token not found'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                sessionRevoked:
                  value:
                    success: false
                    message: 'Your session has ended. Please log in again.'
                    errorType: 'SESSION_REVOKED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '403':
          description: Account inactive or suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Your account is not active. Please verify your email or contact support.'
                errorType: 'ACCOUNT_INACTIVE'
                traceId: '123e4567-e89b-12d3-a456-426614174000'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
    patch:
      tags: [MobileDashboard]
      summary: Update mobile self-profile
      description: |
        Updates the authenticated EMPLOYEE/SITE_MANAGER profile.
        Patchable: `firstName`, `lastName`, `phone` (no format), `avatarUrl` (URL or null),
        `language` (upserts UserPreference). At least one field required.
        Not patchable: email, role, status, password, weeklyHoursTarget.
        Upload avatar via `POST /media` first, then pass the URL.
        Response shape matches GET.
      operationId: updateMobileProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMobileProfileRequest'
            example:
              firstName: Tim
              lastName: Muller
              phone: '+49654515151'
              avatarUrl: https://cdn.example.com/avatar.jpg
              language: DE
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMobileProfileResponse'
        '401':
          description: Authentication or device session failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Account inactive or suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'

  /api/v1/mobile/timer/start:
    post:
      tags: [MobileTimeTracking]
      summary: Start mobile timer
      description: Starts an active TimeLog and returns `{ timeLog, project }` (role-aware project via getProjectDto). Rejects with 409 when an open timer already exists. Requires `phaseId`.
      operationId: startMobileTimer
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMobileTimerRequest'
      responses:
        '201':
          description: Timer started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartMobileTimerResponse'
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'

        '401':
          description: Authentication or device session failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Token not found'
                errorType: 'TOKEN_INVALID'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '403':
          description: Forbidden or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Only site managers can access crew time logs'
                errorType: 'FORBIDDEN'
                traceId: '123e4567-e89b-12d3-a456-426614174000'

        '404':
          description: Phase not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Phase not found'
                errorType: 'PHASE_NOT_FOUND'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '409':
          description: Active timer already exists (checkNoActiveTimerMiddleware)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'An active timer already exists'
                errorType: 'ACTIVE_TIMER_EXISTS'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
