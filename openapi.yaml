              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
  /api/v1/mobile/phases:
    get:
      tags: [MobilePhase]
      summary: List managed phases
      description: >
        Site Manager only. Returns ProjectPhases for projects where the user has
        a ProjectManagerAssignment. Optional `column` maps Phase Board columns:
        `ENQUIRY` filters `status=ENQUIRY` (UI Preconstruction); `ERECTION`,
        `DISMANTLING`, `STANDING` filter by phase `type`.
      operationId: listMobilePhases
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: column
          schema:
            type: string
            enum: [ENQUIRY, ERECTION, DISMANTLING, STANDING]
          description: Phase Board column filter
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Page size
      responses:
        '200':
          description: Phases fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMobilePhasesResponse'

        '401':
          description: Authentication or device session failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Token not found'
                errorType: 'TOKEN_INVALID'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '403':
          description: Forbidden (not site manager / not assigned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Only site managers can access this resource'
                errorType: 'FORBIDDEN'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
  /api/v1/mobile/phases/{id}/status:
    patch:
      tags: [MobilePhase]
      summary: Update managed phase status
      description: Site Manager only. Updates phase status on a managed project, sets endDate when COMPLETED, and writes AuditLog MOBILE_PHASE_STATUS_UPDATED.
      operationId: updateMobilePhaseStatus
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMobilePhaseStatusRequest'
      responses:
        '200':
          description: Phase status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMobilePhaseStatusResponse'

        '401':
          description: Authentication or device session failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Token not found'
                errorType: 'TOKEN_INVALID'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '403':
          description: Forbidden (not site manager / not assigned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Only site managers can access this resource'
                errorType: 'FORBIDDEN'
                traceId: '123e4567-e89b-12d3-a456-426614174000'

        '404':
          description: Phase not found (checkPhaseExistenceMiddleware)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Phase not found'
                errorType: 'PHASE_NOT_FOUND'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'

components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'Cookie based access token for Admin API.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authentication.'

  schemas:
    # ==========================================
    # Request Payload Schemas
    # ==========================================
    SignupRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - role
        - password
      properties:
        firstName:
          type: string
          example: 'John'
          description: First name of the user
        lastName:
          type: string
          example: 'Doe'
          description: Last name of the user
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: Valid and unique email address
        phone:
          type: string
          example: '+49654515151'
          description: Optional phone / mobile number (no format validation)
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: Assigned system role
        password:
          type: string
          format: password
          minLength: 8
          example: 'SecretP@ssw0rd'
          description: User password (minimum 8 characters)

    VerifySignupRequest:
      type: object
      required:
        - otp
        - deviceIdentifier
        - platform
        - lat
        - lng
      properties:
        otp:
          type: string
          minLength: 6
          example: '123456'
          description: 6-digit OTP verification code received via email
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'd8e8fca2-dc0f-48d8-993d-82d8c399b662'
          description: Unique device identifier
        fcmToken:
          type: string
          example: 'fcm-device-push-token-xyz'
          description: Optional FCM token for push notifications
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
          description: Operating system platform of the client device
        lat:
          type: number
          format: double
          example: 52.5200
          description: Current latitude coordinate
        lng:
          type: number
          format: double
          example: 13.4050
          description: Current longitude coordinate

    CheckAccessTokenRequest:
      type: object
      required:
        - deviceIdentifier
        - lat
        - lng
        - platform
      properties:
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'd8e8fca2-dc0f-48d8-993d-82d8c399b662'
          description: Unique device identifier
        lat:
          type: number
          format: double
          example: 52.5200
          description: Current latitude coordinate
        lng:
          type: number
          format: double
          example: 13.4050
          description: Current longitude coordinate
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
          description: Operating system platform of the client device
        fcmToken:
          type: string
          example: 'fcm-device-push-token-xyz'
          description: Optional FCM token for push notifications

    LoginRequest:
      type: object
      required:
        - email
        - password
        - role
        - deviceIdentifier
        - platform
        - lat
        - lng
      properties:
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: Registered user email address
        password:
          type: string
          format: password
          minLength: 1
          example: 'SecretP@ssw0rd'
          description: User account password
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: System role expected for login
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'd8e8fca2-dc0f-48d8-993d-82d8c399b662'
          description: Unique client device identifier
        fcmToken:
          type: string
          example: 'fcm-device-push-token-xyz'
          description: Optional FCM token for push notifications
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
          description: Operating system platform of the device
        lat:
          type: number
          format: double
          example: 52.5200
          description: Current latitude coordinate
        lng:
          type: number
          format: double
          example: 13.4050
          description: Current longitude coordinate
        rememberMe:
          type: boolean
          default: false
          example: false
          description: Flag to extend session token expiration (30 days vs 7 days)

    # ==========================================
    # Response Data / DTO Schemas
    # ==========================================
    SignupDTO:
      type: object
      required:
        - name
        - email
        - role
        - token
      properties:
        name:
          type: string
          example: 'John Doe'
          description: Full name of the registered user
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: Registered email address
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: User role
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          description: Temporary OTP page token used to access the verification screen

    VerifySignupUserDTO:
      type: object
      required:
        - accessToken
        - isProfileSetup
        - role
        - accountStatus
        - id
        - fullName
        - avatarUrl
      properties:
        accessToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          description: JWT access token for authenticating subsequent requests
        isProfileSetup:
          type: boolean
          example: false
          description: Whether the user has completed onboarding profile setup
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: Assigned system role
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
          description: Current account status
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
          description: User unique identifier
        fullName:
          type: string
          example: 'John Doe'
          description: Full name of the user
        avatarUrl:
          type: string
          nullable: true
          format: uri
          example: null
          description: Avatar image URL (or null if none set)

    SessionDTO:
      type: object
      required:
        - userId
        - fullName
        - email
        - phone
        - avatarUrl
        - role
        - status
        - isProfileSetup
        - language
      properties:
        userId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
          description: Unique user identifier
        fullName:
          type: string
          example: 'John Doe'
          description: Full name of the user
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: User email address
        phone:
          type: string
          example: '+1234567890'
          description: User phone number
        avatarUrl:
          type: string
          nullable: true
          format: uri
          example: null
          description: URL to user avatar image (or null if none set)
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: System role of the user
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
          description: Account status
        isProfileSetup:
          type: boolean
          example: true
          description: Whether the user completed profile setup
        language:
          type: string
          enum: [DE, EN, PL, RO, TR, BG, HR, SR, UK, RU, SQ, IT, FR, ES, PT, NL, EL, HU]
          example: 'EN'
          description: Preferred user interface language

    LoginDTO:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          description: JWT authentication access token
        user:
          $ref: '#/components/schemas/SessionDTO'

    # ==========================================
    # 200 - 299 Success Response Schemas
    # ==========================================
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId

    NotificationDTO:
      type: object
      required: [id, type, title, message, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - PROJECT_ASSIGNED
            - TIME_LOG_APPROVED
            - TIME_LOG_REJECTED
            - INSPECTION_SCHEDULED
            - SYSTEM_ALERT
        title:
          type: string
        message:
          type: string
        link:
          type: string
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    GetNotificationsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [meta, data]
          properties:
            message:
              type: string
              example: Notifications retrieved successfully
            meta:
              $ref: '#/components/schemas/PaginationMeta'
            data:
              type: object
              required: [items, unreadCount]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/NotificationDTO'
                unreadCount:
                  type: integer
                  minimum: 0
                  example: 3

    MarkNotificationReadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            message:
              type: string
              example: Notification marked as read
            data:
              type: object
              required: [id, isRead]
              properties:
                id:
                  type: string
                  format: uuid
                isRead:
                  type: boolean
                  example: true

    MarkAllNotificationsReadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            message:
              type: string
              example: All notifications marked as read
            data:
              type: object
              required: [updatedCount]
              properties:
                updatedCount:
                  type: integer
                  minimum: 0
                  example: 5

    AdminDashboardStatsDTO:
      type: object
      required:
        - plannedErections
        - erectionInProgress
        - standingScaffolds
        - plannedDismantling
        - dismantlingInProgress
        - inspectionDue
      properties:
        plannedErections: {type: integer}
        erectionInProgress: {type: integer}
        standingScaffolds: {type: integer}
        plannedDismantling: {type: integer}
        dismantlingInProgress: {type: integer}
        inspectionDue: {type: integer}
    AdminDashboardMapPinDTO:
      type: object
      required: [projectId, name, coordinates, phaseType]
      properties:
        projectId: {type: string, format: uuid}
        name: {type: string}
        coordinates:
          type: object
          nullable: true
          required: [lat, lng]
          properties:
            lat: {type: number}
            lng: {type: number}
        phaseType:
          type: string
          enum: [ERECTION, DISMANTLING, STANDING, MAINTENANCE]
    AdminDashboardMapDTO:
      type: object
      required: [counts, pins]
      properties:
        counts:
          type: object
          required: [erection, standing, dismantling]
          properties:
            erection: {type: integer}
            standing: {type: integer}
            dismantling: {type: integer}
        pins:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardMapPinDTO'
    AdminTodaysOperationDTO:
      type: object
      required:
        - phaseId
        - projectId
        - projectName
        - customerName
        - managerName
        - phaseType
        - crewCount
      properties:
        phaseId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        projectName: {type: string}
        customerName: {type: string}
        managerName: {type: string, nullable: true}
        phaseType:
          type: string
          enum: [ERECTION, DISMANTLING, STANDING, MAINTENANCE]
        crewCount: {type: integer, minimum: 0}
    AdminDashboardDTO:
      type: object
      required: [stats, map, todaysOperations]
      properties:
        stats:
          $ref: '#/components/schemas/AdminDashboardStatsDTO'
        map:
          $ref: '#/components/schemas/AdminDashboardMapDTO'
        todaysOperations:
          type: array
          items:
            $ref: '#/components/schemas/AdminTodaysOperationDTO'
    GetAdminDashboardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [meta, data]
          properties:
            message:
              type: string
              example: 'Dashboard fetched successfully.'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
            data:
              $ref: '#/components/schemas/AdminDashboardDTO'

    PaginationMeta:
      type: object
      required:
        - total
        - totalPages
        - links
      properties:
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8
        links:
          type: object
          required:
            - currentPage
            - firstPage
            - lastPage
          properties:
            currentPage:
              type: string
              example: 'http://localhost:5000/api/v1/items?page=1&limit=20'
            nextPage:
              type: string
              nullable: true
              example: 'http://localhost:5000/api/v1/items?page=2&limit=20'
            previousPage:
              type: string
              nullable: true
              example: null
            firstPage:
              type: string
              example: 'http://localhost:5000/api/v1/items?page=1&limit=20'
            lastPage:
              type: string
              example: 'http://localhost:5000/api/v1/items?page=8&limit=20'

    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
              required:
                - token

    DeleteMediaPayload:
      type: object
      required:
        - urls
      properties:
        urls:
          type: array
          items:
            type: string
            format: uri
            example: 'https://allround-bucket.s3.amazonaws.com/attachments/123e4567-e89b-12d3-a456-426614174000-1697280000000.jpg'
          description: List of media S3 URLs to delete.
    MediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Media uploads successful'
            data:
              type: array
              items:
                type: string
                format: uri
                example: 'https://allround-bucket.s3.amazonaws.com/attachments/123e4567-e89b-12d3-a456-426614174000-1697280000000.jpg'
              description: Array of S3 URLs for uploaded files

    DeleteMediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Media items deletion successful!'

    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Signup successful, Please check your email for verification code to verify your account'
            data:
              $ref: '#/components/schemas/SignupDTO'

    ResendOtpResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Signup verification otp resend successful!'

    VerifySignupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Email verified successfully.'
            data:
              $ref: '#/components/schemas/VerifySignupUserDTO'

    CheckAccessTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'User is authenticated'

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'User login successful.'
            data:
              $ref: '#/components/schemas/LoginDTO'

    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Logout successful.'

    AdminLoginPayload:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          example: Admin@1234
        rememberMe:
          type: boolean
          default: false
          example: false
    AdminDTO:
      type: object
      required:
        - id
        - fullName
        - email
        - phone
        - role
        - status
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        fullName:
          type: string
          example: 'Admin User'
        email:
          type: string
          format: email
          example: 'admin@example.com'
        phone:
          type: string
          example: '1234567890'
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: 'https://example.com/avatar.jpg'
        role:
          type: string
          enum:
            - ADMIN
          example: 'ADMIN'
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
    AdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
            - csrfToken
          properties:
            message:
              type: string
              example: 'Admin login successful!'
            csrfToken:
              type: string
              example: '4f8a2b1c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a'
            data:
              type: object
              required:
                - admin
              properties:
                admin:
                  $ref: '#/components/schemas/AdminDTO'
    CheckAdminAccessTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Admin authenticated successfully'
            data:
              type: object
              required:
                - admin
              properties:
                admin:
                  $ref: '#/components/schemas/AdminDTO'
    RefreshAdminAccessTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - csrfToken
          properties:
            message:
              type: string
              example: 'Admin tokens refreshed successfully'
            csrfToken:
              type: string
              example: '4f8a2b1c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a'
    LogoutAdminResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Admin logged out successfully'


    FindRecoverUserByEmailPayload:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    VerifyRecoverUserOtpPayload:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          example: '123456'
          description: 6-digit numeric OTP
    ResetRecoverUserPasswordPayload:
      type: object
      required:
        - password
        - confirmPassword
      properties:
