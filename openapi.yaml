  /api/v1/admin/recover/reset:
    post:
      tags:
        - Recover
      summary: Reset admin password
      description: Resets the admin's password after OTP verification, updates the credentials in the database, blacklists the recovery token, dispatches a confirmation email via queue, and clears the recover_page_token cookie. Expects the reset password page token in the recover_page_token cookie or Authorization Bearer header.
      operationId: adminRecoverResetPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRecoverUserPasswordPayload'
      responses:
        '200':
          description: Admin password reset successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: 'recover_page_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly'
              description: Clears the recover_page_token HTTP-only cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetRecoverAdminPasswordResponse'
              example:
                success: true
                message: 'Password reset successful'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '400':
          description: Invalid JSON payload or bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  summary: Invalid JSON payload
                  value:
                    success: false
                    message: 'Invalid JSON Payload'
                    errorType: 'INVALID_JSON'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                passwordSameAsPrevious:
                  summary: New password matches previous password
                  value:
                    success: false
                    message: 'Your new password cannot be the same as your previous password.'
                    errorType: 'BAD_REQUEST'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '401':
          description: Authentication failed
