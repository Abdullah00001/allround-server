    # ==========================================
    # 400 - 499 Error Response Schemas
    # ==========================================
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorType:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    AuthErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - TOKEN_EXPIRED
                - TOKEN_INVALID
                - TOKEN_BLACKLISTED
                - USER_SUSPENDED
                - ACCOUNT_INACTIVE
                - USER_ALREADY_EXISTS
                - INVALID_CREDENTIALS
                - DUPLICATE_DATA
                - OTP_EXPIRED
                - INVALID_OTP
                - ACCESS_DENIED
                - USER_NOT_FOUND
                - CUSTOMER_NOT_FOUND
                - INSPECTION_NOT_FOUND
                - INSPECTION_ALREADY_CONVERTED
                - PROJECT_NOT_FOUND
                - PHASE_NOT_FOUND
                - VEHICLE_NOT_FOUND
                - VEHICLE_ALREADY_ASSIGNED
                - TIMELOG_NOT_FOUND
                - ABSENCE_NOT_FOUND
                - INVALID_DEVICE_CONTEXT
                - DEVICE_NOT_FOUND
                - DEVICE_NOT_OWNED
                - SESSION_LOGGED_OUT
                - SESSION_REVOKED
                - SESSION_EXPIRED
                - FORBIDDEN
                - BAD_REQUEST

    DuplicateUserErrorResponse:
      allOf:
        - $ref: '#/components/schemas/AuthErrorResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'User with this email already exist'
            errorType:
              type: string
              example: 'DUPLICATE_DATA'

    UserNotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/AuthErrorResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'User not found'
            errorType:
              type: string
              example: 'USER_NOT_FOUND'

    MulterErrorResponse:
      type: object
      required:
        - success
        - status
        - message
        - traceId
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "'files' attachments are required."
        traceId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

    # ==========================================
    # 500+ Error Response Schemas
    # ==========================================
    SystemErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - INVALID_JSON
                - SERVER_ERROR
