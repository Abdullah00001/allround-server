        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: Assigned system role
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
          description: Current account status
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
          description: User unique identifier
        fullName:
          type: string
          example: 'John Doe'
          description: Full name of the user
        avatarUrl:
          type: string
          nullable: true
          format: uri
          example: null
          description: Avatar image URL (or null if none set)

    SessionDTO:
      type: object
      required:
        - userId
        - fullName
        - email
        - phone
        - avatarUrl
        - role
        - status
        - isProfileSetup
        - language
      properties:
        userId:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
          description: Unique user identifier
        fullName:
          type: string
          example: 'John Doe'
          description: Full name of the user
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: User email address
        phone:
          type: string
          example: '+1234567890'
          description: User phone number
        avatarUrl:
          type: string
          nullable: true
          format: uri
          example: null
          description: URL to user avatar image (or null if none set)
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: System role of the user
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
          description: Account status
        isProfileSetup:
          type: boolean
          example: true
          description: Whether the user completed profile setup
        language:
          type: string
          enum:
            - EN
            - DE
            - TR
          example: 'EN'
          description: Preferred user interface language

