# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/schemas/v3.0/schema.json
openapi: 3.0.3
info:
  title: Allround Server API
  version: 1.0.0
  description: API documentation for the Allround Server backend, powering the Allround real estate project management mobile app and web admin panel.
servers:
  - url: https://allround.localbox.online
    description: Local development server
tags:
  - name: Health
    description: System health and status endpoints
  - name: Auth
    description: Authentication and user registration endpoints
  - name: Admin
    description: Admin authentication and panel endpoints
  - name: Recover
    description: Password recovery endpoints for user and admin
  - name: Media
    description: Media attachment upload and deletion endpoints
  - name: Customer
    description: Admin CRM customer and contact management endpoints
  - name: Inspection
    description: Admin CRM inspection management and project conversion endpoints
  - name: Project
    description: Admin project management and Kanban phase board endpoints
  - name: Planning
    description: Admin daily planning and resource assignment endpoints
  - name: TimeLog
    description: Admin time tracking and approval endpoints
  - name: Absence
    description: Admin workforce absence management endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Reports the health status of the application and its dependencies (Database, Redis).
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account, sends a 6-digit OTP verification code via email, and returns an OTP verification page token.
      operationId: signupUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid JSON Payload'
                      errorType:
                        type: string
                        example: 'INVALID_JSON'
        '409':
          description: User with email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateUserErrorResponse'
        '422':
          description: Request payload validation failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Request body validation failed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

  /api/v1/auth/resend:
    post:
      tags:
        - Auth
      summary: Resend signup verification OTP
      description: Resends a new 6-digit OTP verification code to the registered user's email using their temporary OTP page token.
      operationId: resendSignupOtp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOtpResponse'
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid JSON Payload'
                      errorType:
                        type: string
                        example: 'INVALID_JSON'
        '401':
          description: Authentication token missing, expired, revoked, or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenMissing:
                  summary: Authentication token missing
                  value:
                    success: false
                    message: 'Authentication token not found'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenExpired:
                  summary: Token has expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenRevoked:
                  summary: Token has been revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenInvalid:
                  summary: Token is invalid
                  value:
                    success: false
                    message: 'Token is invalid'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify signup OTP and activate account
      description: Verifies the 6-digit OTP code against the temporary OTP page token, marks the user account ACTIVE, creates a new active device session, and issues a JWT access token.
      operationId: verifySignupUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignupRequest'
      responses:
        '200':
          description: Email verified successfully and access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySignupResponse'
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid JSON Payload'
                      errorType:
                        type: string
                        example: 'INVALID_JSON'
        '401':
          description: Unauthorized - Invalid/expired OTP or authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                invalidOtp:
                  summary: Invalid OTP code
                  value:
                    success: false
                    message: 'Invalid OTP, please check and try again'
                    errorType: 'INVALID_OTP'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                otpExpired:
                  summary: OTP expired
                  value:
                    success: false
                    message: 'OTP has expired, please request a new one'
                    errorType: 'OTP_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenMissing:
                  summary: Authentication token missing
                  value:
                    success: false
                    message: 'Authentication token not found'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenExpired:
                  summary: Authentication token expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenRevoked:
                  summary: Authentication token revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundErrorResponse'
        '422':
          description: Request payload validation failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Request body validation failed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

  /api/v1/auth/check:
    post:
      tags:
        - Auth
      summary: Validate user access token and device session
      description: Validates the user JWT access token, verifies account active status, validates device session status and expiry, and updates device last-seen timestamp and GPS coordinates.
      operationId: checkUserAccessToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAccessTokenRequest'
      responses:
        '200':
          description: User access token and device session are valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAccessTokenResponse'
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid JSON Payload'
                      errorType:
                        type: string
                        example: 'INVALID_JSON'
        '401':
          description: Unauthorized - Invalid token or expired/revoked device session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenMissing:
                  summary: Token not found
                  value:
                    success: false
                    message: 'Token not found'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenExpired:
                  summary: Token expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenRevoked:
                  summary: Token revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                sessionExpired:
                  summary: Device session expired
                  value:
                    success: false
                    message: 'Your session has expired. Please log in again.'
                    errorType: 'SESSION_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                sessionRevoked:
                  summary: Device session revoked
                  value:
                    success: false
                    message: 'Your session has ended. Please log in again.'
                    errorType: 'SESSION_REVOKED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                sessionLoggedOut:
                  summary: Device logged out
                  value:
                    success: false
                    message: 'You have been logged out. Please log in again.'
                    errorType: 'SESSION_LOGGED_OUT'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                deviceNotFound:
                  summary: Device session not found
                  value:
                    success: false
                    message: 'Session is no longer valid. Please log in again.'
                    errorType: 'DEVICE_NOT_FOUND'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '403':
          description: Forbidden - Account is suspended or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                userSuspended:
                  summary: Account suspended
                  value:
                    success: false
                    message: 'Your account has been suspended. Please contact the academy.'
                    errorType: 'USER_SUSPENDED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                accountInactive:
                  summary: Account inactive
                  value:
                    success: false
                    message: 'Your account is not active. Please verify your email or contact support.'
                    errorType: 'ACCOUNT_INACTIVE'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundErrorResponse'
        '422':
          description: Request payload validation failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Request body validation failed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticates user credentials against the specified role, verifies active account status, initializes a new device session, updates last login time and location coordinates, and returns a JWT access token and user session data.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid JSON Payload'
                      errorType:
                        type: string
                        example: 'INVALID_JSON'
        '401':
          description: Unauthorized - Invalid email, role, or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                invalidCredentials:
                  summary: Invalid credentials
                  value:
                    success: false
                    message: 'Invalid Credential,Check Your Email And Password'
                    errorType: 'INVALID_CREDENTIALS'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '403':
          description: Forbidden - Account is suspended or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                userSuspended:
                  summary: Account suspended
                  value:
                    success: false
                    message: 'Your account has been suspended. Please contact the academy.'
                    errorType: 'USER_SUSPENDED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                accountInactive:
                  summary: Account inactive
                  value:
                    success: false
                    message: 'Your account is not active. Please verify your email or contact support.'
                    errorType: 'ACCOUNT_INACTIVE'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '422':
          description: Request payload validation failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Request body validation failed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      description: Logs out the current device session, marks device status as LOGGED_OUT, clears the FCM push token, and blacklists the current user access JWT in Redis for its remaining time-to-live.
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                success: true
                message: 'Logout successful.'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '401':
          description: Authentication or device session error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenMissing:
                  summary: Token not found
                  value:
                    success: false
                    message: 'Token not found'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenInvalid:
                  summary: Token is invalid
                  value:
                    success: false
                    message: 'Token is invalid'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenExpired:
                  summary: Token expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenRevoked:
                  summary: Token revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                missingDevice:
                  summary: Missing device context
                  value:
                    success: false
                    message: 'Session is missing device information.'
                    errorType: 'INVALID_DEVICE_CONTEXT'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                deviceNotFound:
                  summary: Device not found
                  value:
                    success: false
                    message: 'Session is no longer valid. Please log in again.'
                    errorType: 'DEVICE_NOT_FOUND'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                deviceNotOwned:
                  summary: Device not owned
                  value:
                    success: false
                    message: 'Session is no longer valid. Please log in again.'
                    errorType: 'DEVICE_NOT_OWNED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                sessionLoggedOut:
                  summary: Session logged out
                  value:
                    success: false
                    message: 'You have been logged out. Please log in again.'
                    errorType: 'SESSION_LOGGED_OUT'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                sessionRevoked:
                  summary: Session revoked
                  value:
                    success: false
                    message: 'Your session has ended. Please log in again.'
                    errorType: 'SESSION_REVOKED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                sessionExpired:
                  summary: Session expired
                  value:
                    success: false
                    message: 'Your session has expired. Please log in again.'
                    errorType: 'SESSION_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '403':
          description: Account status error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                userSuspended:
                  summary: Account suspended
                  value:
                    success: false
                    message: 'Your account has been suspended. Please contact the academy.'
                    errorType: 'USER_SUSPENDED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                accountInactive:
                  summary: Account inactive
                  value:
                    success: false
                    message: 'Your account is not active. Please verify your email or contact support.'
                    errorType: 'ACCOUNT_INACTIVE'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'User not found'
                errorType: 'USER_NOT_FOUND'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

  /api/v1/admin/auth/login:
    post:
      tags:
        - Admin
      summary: Admin login
      description: Authenticates an administrator with email and password, returning admin details and CSRF token, and setting access_token, refresh_token, and admin_csrf_token cookies.
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginPayload'
      responses:
        '200':
          description: Admin login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: 'access_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/; HttpOnly; SameSite=Lax'
              description: Sets access_token, refresh_token, and admin_csrf_token cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Invalid JSON Payload'
                errorType: 'INVALID_JSON'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: 'Invalid Credential,Check Your Email And Password'
                errorType: 'INVALID_CREDENTIALS'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '403':
          description: Account status forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                userSuspended:
                  summary: Account suspended
                  value:
                    success: false
                    message: 'Your account has been suspended. Please contact the academy.'
                    errorType: 'USER_SUSPENDED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                accountInactive:
                  summary: Account inactive
                  value:
                    success: false
                    message: 'Your account is not active. Please verify your email or contact support.'
                    errorType: 'ACCOUNT_INACTIVE'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '422':
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: 'Request body validation failed'
                errors:
                  - field: email
                    message: 'Please provide a valid email address'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorResponse'
              example:
                success: false
                message: 'Internal Server Error'
                errorType: 'SERVER_ERROR'
                traceId: '123e4567-e89b-12d3-a456-426614174000'
  /api/v1/admin/auth/check:
    post:
      tags:
        - Admin
      summary: Check admin access token
      description: Validates admin authentication state from the access_token cookie and Double Submit CSRF token from the x-csrf-token header, returning current admin details.
      operationId: checkAdminAccessToken
      security:
        - adminAuth: []
      parameters:
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
          description: Double Submit CSRF token matching the admin_csrf_token cookie.
      responses:
        '200':
          description: Admin authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAdminAccessTokenResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenExpired:
                  summary: Token expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenInvalid:
                  summary: Token invalid
                  value:
                    success: false
                    message: 'Token is invalid'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenBlacklisted:
                  summary: Token revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
