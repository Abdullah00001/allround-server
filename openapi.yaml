                - TIMELOG_NOT_FOUND
                - ACTIVE_TIMER_EXISTS
                - ABSENCE_NOT_FOUND
                - CREW_ASSIGNMENT_NOT_FOUND
                - VEHICLE_ASSIGNMENT_NOT_FOUND
                - INVALID_DEVICE_CONTEXT
                - DEVICE_NOT_FOUND
                - DEVICE_NOT_OWNED
                - SESSION_LOGGED_OUT
                - SESSION_REVOKED
                - SESSION_EXPIRED
                - FORBIDDEN
                - BAD_REQUEST

    DuplicateUserErrorResponse:
      allOf:
        - $ref: '#/components/schemas/AuthErrorResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'User with this email already exist'
            errorType:
              type: string
              example: 'DUPLICATE_DATA'

    UserNotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/AuthErrorResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'User not found'
            errorType:
              type: string
              example: 'USER_NOT_FOUND'

    MulterErrorResponse:
      type: object
      required:
        - success
        - status
        - message
        - traceId
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "'files' attachments are required."
        traceId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

    # ==========================================
    # 500+ Error Response Schemas
    # ==========================================
    SystemErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - INVALID_JSON
                - SERVER_ERROR
