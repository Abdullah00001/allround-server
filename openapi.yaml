                message: 'Internal Server Error'
                errorType: 'SERVER_ERROR'
                traceId: '123e4567-e89b-12d3-a456-426614174000'

components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'Cookie based access token for Admin API.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authentication.'

  schemas:
    # ==========================================
    # Request Payload Schemas
    # ==========================================
    SignupRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - role
        - password
      properties:
        firstName:
          type: string
          example: 'John'
          description: First name of the user
        lastName:
          type: string
          example: 'Doe'
          description: Last name of the user
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: Valid and unique email address
        phone:
          type: string
          pattern: '^[0-9]{10}$'
          example: '1234567890'
          description: Optional 10-digit phone number
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: Assigned system role
        password:
          type: string
          format: password
          minLength: 8
          example: 'SecretP@ssw0rd'
          description: User password (minimum 8 characters)

    VerifySignupRequest:
      type: object
      required:
        - otp
        - deviceIdentifier
        - platform
        - lat
        - lng
      properties:
        otp:
          type: string
          minLength: 6
          example: '123456'
          description: 6-digit OTP verification code received via email
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'd8e8fca2-dc0f-48d8-993d-82d8c399b662'
          description: Unique device identifier
        fcmToken:
          type: string
          example: 'fcm-device-push-token-xyz'
          description: Optional FCM token for push notifications
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
          description: Operating system platform of the client device
        lat:
          type: number
          format: double
          example: 52.5200
          description: Current latitude coordinate
        lng:
          type: number
          format: double
          example: 13.4050
          description: Current longitude coordinate

    CheckAccessTokenRequest:
      type: object
      required:
        - deviceIdentifier
        - lat
        - lng
        - platform
      properties:
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'd8e8fca2-dc0f-48d8-993d-82d8c399b662'
          description: Unique device identifier
        lat:
          type: number
          format: double
          example: 52.5200
          description: Current latitude coordinate
        lng:
          type: number
          format: double
          example: 13.4050
          description: Current longitude coordinate
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
          description: Operating system platform of the client device
        fcmToken:
          type: string
          example: 'fcm-device-push-token-xyz'
          description: Optional FCM token for push notifications

    LoginRequest:
      type: object
      required:
        - email
        - password
        - role
        - deviceIdentifier
        - platform
        - lat
        - lng
      properties:
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: Registered user email address
        password:
          type: string
          format: password
          minLength: 1
          example: 'SecretP@ssw0rd'
          description: User account password
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: System role expected for login
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'd8e8fca2-dc0f-48d8-993d-82d8c399b662'
          description: Unique client device identifier
        fcmToken:
          type: string
          example: 'fcm-device-push-token-xyz'
          description: Optional FCM token for push notifications
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
          description: Operating system platform of the device
        lat:
          type: number
          format: double
          example: 52.5200
          description: Current latitude coordinate
        lng:
          type: number
          format: double
          example: 13.4050
          description: Current longitude coordinate
        rememberMe:
          type: boolean
          default: false
          example: false
          description: Flag to extend session token expiration (30 days vs 7 days)

    # ==========================================
    # Response Data / DTO Schemas
    # ==========================================
    SignupDTO:
      type: object
      required:
        - name
        - email
        - role
        - token
      properties:
        name:
          type: string
          example: 'John Doe'
          description: Full name of the registered user
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: Registered email address
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: User role
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          description: Temporary OTP page token used to access the verification screen

    VerifySignupUserDTO:
      type: object
      required:
        - accessToken
        - isProfileSetup
        - role
        - accountStatus
        - id
        - fullName
        - avatarUrl
      properties:
