    post:
      tags: [Project]
      summary: Create project
      description: |
        Same body schema as mobile `POST /mobile/projects` (`CreateMobileProjectRequest`),
        except **`siteManagerId` is required** (assignee PM).

        **Customer (`customer.mode` discriminator):**
        - `EXISTING` — `{ "mode": "EXISTING", "customerId": "<uuid>" }`. Do **not** send
          `name` / `category`. Links project to that customer; upserts primary contact
          from top-level `contact`.
        - `NEW` — `{ "mode": "NEW", "name": "...", "category?": "COMMERCIAL" }`. Do **not**
          send `customerId`. Creates customer + primary contact. Category defaults to
          `COMMERCIAL` (`COMMERCIAL` | `MUNICIPALITY` | `ARCHITECT` | `PRIVATE`).

        **`contact` is always required** for both modes.

        **`status`:** `PhaseStatus` only (`ENQUIRY`, `QUOTATION`, `ORDER_CONFIRMED`,
        `IN_PROGRESS`, `COMPLETED`, `POSTPONED`). No `PLANNED` / `NOT_STARTED` —
        map UI “Planned” → `ENQUIRY`.
      operationId: createAdminProject
      security:
        - adminAuth: []
      parameters:
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMobileProjectRequest'
            examples:
              existingCustomer:
                summary: Existing customer (+ required siteManagerId)
                description: >
                  mode=EXISTING requires customerId only. contact + siteManagerId required.
                value:
                  name: Goltstein Complex
                  coordinates: { lat: 50.9082, lng: 6.9723 }
                  placeLabel: Goltsteinstraße 12, Köln
                  scaffoldSpecification: { area: 450, height: 15, type: Modular scaffold }
                  priority: MEDIUM
                  phaseType: ERECTION
                  status: ENQUIRY
                  siteManagerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  customer:
                    mode: EXISTING
                    customerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  contact:
                    name: Andreas Weber
                    phone: '+49654515151'
                    email: abc@yopmail.com
                    role: Project lead
                  scheduleData:
                    - type: erection
                      startDate: '2026-11-14T18:00:00.000Z'
                      endDate: '2026-11-18T08:30:00.000Z'
                      durationDays: 3
                    - type: dismantling
                      startDate: '2026-11-29T08:30:00.000Z'
                      endDate: '2026-12-02T08:30:00.000Z'
                      durationDays: 3
              newCustomer:
                summary: New customer (+ required siteManagerId)
                description: >
                  mode=NEW requires name (+ optional category). Do not send customerId.
                value:
                  name: Goltstein Complex
                  coordinates: { lat: 50.9082, lng: 6.9723 }
                  placeLabel: Goltsteinstraße 12, Köln
                  scaffoldSpecification: { area: 450, height: 15, type: Modular scaffold }
                  priority: MEDIUM
                  phaseType: ERECTION
                  status: ENQUIRY
                  siteManagerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  customer:
                    mode: NEW
                    name: Hochtief AG
                    category: COMMERCIAL
                  contact:
                    name: Andreas Weber
                    phone: '+49654515151'
                    email: abc@yopmail.com
                    role: Project lead
                  scheduleData:
                    - type: erection
                      startDate: '2026-11-14T18:00:00.000Z'
                      endDate: '2026-11-18T08:30:00.000Z'
                      durationDays: 3
      responses:
