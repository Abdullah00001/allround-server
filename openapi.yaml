# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/schemas/v3.0/schema.json
openapi: 3.0.3
info:
  title: Allround Server API
  version: 1.0.0
  description: API documentation for the Allround Server backend, powering the Allround real estate project management mobile app and web admin panel.
servers:
  - url: https://allround.localbox.online
    description: Local development server
tags:
  - name: Health
    description: System health and status endpoints
  - name: Auth
    description: Authentication and user registration endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Reports the health status of the application and its dependencies (Database, Redis).
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account, sends a 6-digit OTP verification code via email, and returns an OTP verification page token.
      operationId: signupUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid JSON Payload'
                      errorType:
                        type: string
                        example: 'INVALID_JSON'
        '409':
          description: User with email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateUserErrorResponse'
        '422':
          description: Request payload validation failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Request body validation failed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

  /api/v1/auth/resend:
    post:
      tags:
        - Auth
      summary: Resend signup verification OTP
      description: Resends a new 6-digit OTP verification code to the registered user's email using their temporary OTP page token.
      operationId: resendSignupOtp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOtpResponse'
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid JSON Payload'
                      errorType:
                        type: string
                        example: 'INVALID_JSON'
        '401':
          description: Authentication token missing, expired, revoked, or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                tokenMissing:
                  summary: Authentication token missing
                  value:
                    success: false
                    message: 'Authentication token not found'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenExpired:
                  summary: Token has expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenRevoked:
                  summary: Token has been revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenInvalid:
                  summary: Token is invalid
                  value:
                    success: false
                    message: 'Token is invalid'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify signup OTP and activate account
      description: Verifies the 6-digit OTP code against the temporary OTP page token, marks the user account ACTIVE, creates a new active device session, and issues a JWT access token.
      operationId: verifySignupUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignupRequest'
      responses:
        '200':
          description: Email verified successfully and access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySignupResponse'
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid JSON Payload'
                      errorType:
                        type: string
                        example: 'INVALID_JSON'
        '401':
          description: Unauthorized - Invalid/expired OTP or authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                invalidOtp:
                  summary: Invalid OTP code
                  value:
                    success: false
                    message: 'Invalid OTP, please check and try again'
                    errorType: 'INVALID_OTP'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                otpExpired:
                  summary: OTP expired
                  value:
                    success: false
                    message: 'OTP has expired, please request a new one'
                    errorType: 'OTP_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenMissing:
                  summary: Authentication token missing
                  value:
                    success: false
                    message: 'Authentication token not found'
                    errorType: 'TOKEN_INVALID'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenExpired:
                  summary: Authentication token expired
                  value:
                    success: false
                    message: 'Token has been expired'
                    errorType: 'TOKEN_EXPIRED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
                tokenRevoked:
                  summary: Authentication token revoked
                  value:
                    success: false
                    message: 'Token has been revoked'
                    errorType: 'TOKEN_BLACKLISTED'
                    traceId: '123e4567-e89b-12d3-a456-426614174000'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundErrorResponse'
        '422':
          description: Request payload validation failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Request body validation failed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SystemErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Internal Server Error'
                      errorType:
                        type: string
                        example: 'SERVER_ERROR'

components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'Cookie based access token for Admin API.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authentication.'

  schemas:
    # ==========================================
    # Request Payload Schemas
    # ==========================================
    SignupRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - role
        - password
      properties:
        firstName:
          type: string
          example: 'John'
          description: First name of the user
        lastName:
          type: string
          example: 'Doe'
          description: Last name of the user
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: Valid and unique email address
        phone:
          type: string
          pattern: '^[0-9]{10}$'
          example: '1234567890'
          description: Optional 10-digit phone number
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: Assigned system role
        password:
          type: string
          format: password
          minLength: 8
          example: 'SecretP@ssw0rd'
          description: User password (minimum 8 characters)

    VerifySignupRequest:
      type: object
      required:
        - otp
        - deviceIdentifier
        - platform
        - lat
        - lng
      properties:
        otp:
          type: string
          minLength: 6
          example: '123456'
          description: 6-digit OTP verification code received via email
        deviceIdentifier:
          type: string
          minLength: 1
          example: 'd8e8fca2-dc0f-48d8-993d-82d8c399b662'
          description: Unique device identifier
        fcmToken:
          type: string
          example: 'fcm-device-push-token-xyz'
          description: Optional FCM token for push notifications
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: 'ANDROID'
          description: Operating system platform of the client device
        lat:
          type: number
          format: double
          example: 52.5200
          description: Current latitude coordinate
        lng:
          type: number
          format: double
          example: 13.4050
          description: Current longitude coordinate

    # ==========================================
    # Response Data / DTO Schemas
    # ==========================================
    SignupDTO:
      type: object
      required:
        - name
        - email
        - role
        - token
      properties:
        name:
          type: string
          example: 'John Doe'
          description: Full name of the registered user
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
          description: Registered email address
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: User role
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          description: Temporary OTP page token used to access the verification screen

    VerifySignupUserDTO:
      type: object
      required:
        - accessToken
        - isProfileSetup
        - role
        - accountStatus
        - id
        - fullName
        - avatarUrl
      properties:
        accessToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          description: JWT access token for authenticating subsequent requests
        isProfileSetup:
          type: boolean
          example: false
          description: Whether the user has completed onboarding profile setup
        role:
          type: string
          enum:
            - ADMIN
            - SITE_MANAGER
            - EMPLOYEE
          example: 'EMPLOYEE'
          description: Assigned system role
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: 'ACTIVE'
          description: Current account status
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
          description: User unique identifier
        fullName:
          type: string
          example: 'John Doe'
          description: Full name of the user
        avatarUrl:
          type: string
          nullable: true
          format: uri
          example: null
          description: Avatar image URL (or null if none set)

    # ==========================================
    # 200 - 299 Success Response Schemas
    # ==========================================
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId

    PaginationMeta:
      type: object
      required:
        - total
        - totalPages
        - links
      properties:
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8
        links:
          type: object
          required:
            - currentPage
            - firstPage
            - lastPage
          properties:
            currentPage:
              type: string
              example: 'http://localhost:5000/api/v1/items?page=1&limit=20'
            nextPage:
              type: string
              nullable: true
              example: 'http://localhost:5000/api/v1/items?page=2&limit=20'
            previousPage:
              type: string
              nullable: true
              example: null
            firstPage:
              type: string
              example: 'http://localhost:5000/api/v1/items?page=1&limit=20'
            lastPage:
              type: string
              example: 'http://localhost:5000/api/v1/items?page=8&limit=20'

    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
              required:
                - token

    MediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Media uploads successful'
            data:
              type: array
              items:
                type: string
                format: uri
                example: 'https://allround-bucket.s3.amazonaws.com/attachments/123e4567-e89b-12d3-a456-426614174000-1697280000000.jpg'
              description: Array of S3 URLs for uploaded files

    DeleteMediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Media items deletion successful!'

    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Signup successful, Please check your email for verification code to verify your account'
            data:
              $ref: '#/components/schemas/SignupDTO'

    ResendOtpResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'Signup verification otp resend successful!'

    VerifySignupResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - data
          properties:
            message:
              type: string
              example: 'Email verified successfully.'
            data:
              $ref: '#/components/schemas/VerifySignupUserDTO'

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Server Is Running
        dependencies:
          type: object
          properties:
            database:
              type: string
              example: up
            redis:
              type: string
              example: up
        traceId:
          type: string
          format: uuid

    # ==========================================
    # 400 - 499 Error Response Schemas
    # ==========================================
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errorType:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    AuthErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - TOKEN_EXPIRED
                - TOKEN_INVALID
                - TOKEN_BLACKLISTED
                - USER_SUSPENDED
                - ACCOUNT_INACTIVE
                - USER_ALREADY_EXISTS
                - INVALID_CREDENTIALS
                - DUPLICATE_DATA
                - OTP_EXPIRED
                - INVALID_OTP
                - ACCESS_DENIED
                - USER_NOT_FOUND
                - INVALID_DEVICE_CONTEXT
                - DEVICE_NOT_FOUND
                - DEVICE_NOT_OWNED
                - SESSION_LOGGED_OUT
                - SESSION_REVOKED
                - SESSION_EXPIRED
                - FORBIDDEN
                - BAD_REQUEST

    DuplicateUserErrorResponse:
      allOf:
        - $ref: '#/components/schemas/AuthErrorResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'User with this email already exist'
            errorType:
              type: string
              example: 'DUPLICATE_DATA'

    UserNotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/AuthErrorResponse'
        - type: object
          properties:
            message:
              type: string
              example: 'User not found'
            errorType:
              type: string
              example: 'USER_NOT_FOUND'

    MulterErrorResponse:
      type: object
      required:
        - success
        - status
        - message
        - traceId
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "'files' attachments are required."
        traceId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000

    # ==========================================
    # 500+ Error Response Schemas
    # ==========================================
    SystemErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - INVALID_JSON
                - SERVER_ERROR
