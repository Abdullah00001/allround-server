    CreateMobileProjectCustomerExisting:
      type: object
      description: >
        Link project to an existing customer. Upserts a new primary contact from
        the top-level `contact` object. Do not send `name` or `category`.
      required: [mode, customerId]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [EXISTING]
          example: EXISTING
        customerId:
          type: string
          format: uuid
          description: Existing Customer.id
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    CreateMobileProjectCustomerNew:
      type: object
      description: >
        Create a new customer for this project. Do not send `customerId`.
        Customer geo/address is taken from project `coordinates` / `placeLabel`.
      required: [mode, name]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [NEW]
          example: NEW
        name:
          type: string
          description: New customer company name
          example: Hochtief AG
        category:
          type: string
          enum: [COMMERCIAL, MUNICIPALITY, ARCHITECT, PRIVATE]
          default: COMMERCIAL
          description: Optional; defaults to COMMERCIAL
          example: COMMERCIAL
    CreateMobileProjectRequest:
      type: object
      required: [name, coordinates, customer, contact]
      description: |
        Site Manager create-project body.

        `customer` is a discriminated union on `mode`:
        - EXISTING → `{ mode, customerId }` only
        - NEW → `{ mode, name, category? }` only

        `contact` is always required (both modes).
      properties:
        name: {type: string, example: Goltstein Complex}
        coordinates:
          type: object
          required: [lat, lng]
          properties:
            lat: {type: number, example: 50.9082}
            lng: {type: number, example: 6.9723}
        placeLabel:
          type: string
          description: Optional map place label stored as Project.address
          example: Goltsteinstraße 12, Köln
        scaffoldSpecification:
          type: object
          required: [area]
          description: >
            Scaffold spec returned on project detail. area → Project.scaffoldArea;
            height/type seed an initial measurement for detail aggregation.
          properties:
            area: {type: number, example: 450}
            height: {type: number, example: 15}
            type: {type: string, example: Modular scaffold}
        scaffoldArea:
          type: number
          deprecated: true
          description: Prefer scaffoldSpecification.area
        priority: {type: string, enum: [HIGH, MEDIUM, LOW], default: MEDIUM, example: MEDIUM}
        phaseType: {type: string, enum: [ERECTION, DISMANTLING, STANDING, MAINTENANCE], default: ERECTION, example: ERECTION}
        status:
          type: string
          enum: [ENQUIRY, QUOTATION, ORDER_CONFIRMED, IN_PROGRESS, COMPLETED, POSTPONED]
          default: ENQUIRY
          example: ENQUIRY
          description: >
            PhaseStatus only. No PLANNED/NOT_STARTED — map UI Planned → ENQUIRY.
            See GET /mobile/config → enums.phaseStatus.
        siteManagerId:
          type: string
          format: uuid
          description: Defaults to authenticated site manager (required for admin create)
        customer:
          description: Discriminated by `mode` — EXISTING (customerId) or NEW (name + optional category)
          discriminator:
            propertyName: mode
            mapping:
              EXISTING: '#/components/schemas/CreateMobileProjectCustomerExisting'
              NEW: '#/components/schemas/CreateMobileProjectCustomerNew'
          oneOf:
            - $ref: '#/components/schemas/CreateMobileProjectCustomerExisting'
            - $ref: '#/components/schemas/CreateMobileProjectCustomerNew'
        contact:
          type: object
          required: [name]
          description: Always required. Becomes the primary CustomerContact (both EXISTING and NEW).
          properties:
            name: {type: string, example: Andreas Weber}
            phone: {type: string, example: '+49654515151'}
            email: {type: string, format: email, example: abc@yopmail.com}
            role: {type: string, default: Project lead, example: Project lead}
        scheduleData:
          type: array
          minItems: 1
          description: >
            Flutter Activity Type schedules (same fields as detail). type lowercase.
            Require startDate plus endDate and/or durationDays.
          items:
            type: object
            required: [type, startDate]
            properties:
              type: {type: string, enum: [erection, dismantling, standing, other]}
              startDate: {type: string, format: date-time}
              endDate: {type: string, format: date-time}
              durationDays: {type: number, minimum: 0}
        schedules:
          type: array
          minItems: 1
          deprecated: true
          description: Prefer scheduleData
          items:
            type: object
            required: [type, startDate, durationDays]
            properties:
              type: {type: string, enum: [erection, dismantling, standing, other]}
              startDate: {type: string, format: date-time}
              durationDays: {type: number, minimum: 0}
        erection:
          type: array
          minItems: 1
          deprecated: true
          description: Prefer scheduleData with type erection
          items:
            type: object
            required: [startDate, durationDays]
            properties:
              startDate: {type: string, format: date-time}
              durationDays: {type: number, minimum: 0}
        dismantling:
          type: array
          minItems: 1
          deprecated: true
          description: Prefer scheduleData with type dismantling
          items:
            type: object
            required: [startDate, durationDays]
            properties:
              startDate: {type: string, format: date-time}
              durationDays: {type: number, minimum: 0}
        note:
          type: object
          required: [category, content]
          properties:
            category: {type: string, enum: [SITE_ACCESS, CUSTOMER_REQUEST, OPEN_POINTS, AGREEMENTS, SPECIAL_REQUIREMENTS, LOCAL_CONTACT, GENERAL]}
            content: {type: string}
        photos:
          type: array
          maxItems: 20
          items:
            type: object
            required: [url, fileType]
            properties:
              url: {type: string, format: uri}
              fileType: {type: string}
              fileName: {type: string}
              fileSize: {type: integer}
              isCover: {type: boolean}

