# VPS self-host stack (clone + build). No container registry.
# Run from this directory: `cd docker && docker compose up -d --build`
# Nginx on the host should proxy TLS → http://127.0.0.1:5000

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: allround-server-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-allround-server}
    volumes:
      - allround-server-postgres-volume:/var/lib/postgresql/data
    networks:
      - allround-server-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: allround-server-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}",
      ]
    volumes:
      - allround-server-redis-volume:/data
    networks:
      - allround-server-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  db-migrator:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: allround-server-server:local
    container_name: allround-server-db-migrator
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in docker/.env}
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - allround-server-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  scheduler:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    image: allround-server-scheduler:local
    container_name: allround-server-scheduler
    env_file: .env
    networks:
      - allround-server-network
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof node > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: allround-server-worker:local
    container_name: allround-server-worker
    env_file: .env
    networks:
      - allround-server-network
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof node > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: allround-server-server:local
    container_name: allround-server-server
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - allround-server-network
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  allround-server-network:
    driver: bridge

volumes:
  allround-server-postgres-volume:
  allround-server-redis-volume:
